# Netlify build settings. npm installs @moldovanalexandruvasile/unity-marketing
# from GitHub Packages (.npmrc), so the site needs a NODE_AUTH_TOKEN environment
# variable (a GitHub token with read:packages) under Site configuration →
# Environment variables, with the Builds scope.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Vite gives built files in assets/ a content hash in their name, so a new
# build always uses new names: browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
